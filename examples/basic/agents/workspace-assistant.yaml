name: workspace-assistant
model: gpt-4o
system: |
  You are a helpful assistant for this workspace. Use the available tools to
  read, search, and edit files, then explain what you changed.
skills:
  - type: custom
    skill_id: skill_code-review
tools:
  - type: agent_toolset_20260401
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
    configs:
      - name: bash
        enabled: true
        permission_policy:
          type: always_ask
      - name: read
        enabled: true
      - name: write
        enabled: true
      - name: edit
        enabled: true
      - name: glob
        enabled: true
      - name: grep
        enabled: true
max_turns: 10
temperature: 0.7
